<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Stackly — Enterprise SLA Performance & Uptime Dashboard</title>
  
  <!-- Modern Google Fonts: Playfair Display + Plus Jakarta Sans + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       STACKLY SLA DASHBOARD - DESIGN SYSTEM (3 THEMES: LIGHT PRO, DARK, ORANGE)
       ========================================================================== */
    :root, [data-theme="dark"] {
      --bg-primary: #090a0f;
      --bg-secondary: #0f1118;
      --bg-surface: #12141f;
      --bg-surface-elevated: #1a1d2d;
      --bg-subtle: #191c2b;
      --bg-muted: #24293e;
      --text-primary: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --brand-primary: #ff6b00;
      --brand-primary-hover: #ff8533;
      --brand-light: rgba(255, 107, 0, 0.15);
      --brand-border: rgba(255, 107, 0, 0.4);
      --brand-gradient: linear-gradient(135deg, #ff6b00 0%, #ff8800 45%, #f59e0b 100%);
      --status-healthy: #10b981;
      --status-healthy-bg: rgba(16, 185, 129, 0.15);
      --status-healthy-border: rgba(16, 185, 129, 0.4);
      --status-warning: #ff9800;
      --status-warning-bg: rgba(255, 152, 0, 0.15);
      --status-warning-border: rgba(255, 152, 0, 0.4);
      --status-critical: #ef4444;
      --status-critical-bg: rgba(239, 68, 68, 0.15);
      --status-critical-border: rgba(239, 68, 68, 0.4);
      --border-light: #24283c;
      --border-subtle: #191c2b;
      --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 6px 16px -2px rgba(0, 0, 0, 0.6);
      --shadow-lg: 0 12px 28px -4px rgba(0, 0, 0, 0.7);
      --shadow-xl: 0 20px 40px -6px rgba(0, 0, 0, 0.8);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-heading: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg-primary: #090a0f;
      --bg-secondary: #0f1118;
      --bg-surface: #12141f;
      --bg-surface-elevated: #1a1d2d;
      --bg-subtle: #191c2b;
      --bg-muted: #24293e;
      --text-primary: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --brand-primary: #ff6b00;
      --brand-primary-hover: #ff8533;
      --brand-light: rgba(255, 107, 0, 0.15);
      --brand-border: rgba(255, 107, 0, 0.4);
      --brand-gradient: linear-gradient(135deg, #ff6b00 0%, #ff8800 45%, #f59e0b 100%);
      --status-healthy: #10b981;
      --status-healthy-bg: rgba(16, 185, 129, 0.15);
      --status-healthy-border: rgba(16, 185, 129, 0.4);
      --status-warning: #ff9800;
      --status-warning-bg: rgba(255, 152, 0, 0.15);
      --status-warning-border: rgba(255, 152, 0, 0.4);
      --status-critical: #ef4444;
      --status-critical-bg: rgba(239, 68, 68, 0.15);
      --status-critical-border: rgba(239, 68, 68, 0.4);
      --border-light: #24283c;
      --border-subtle: #191c2b;
      --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 6px 16px -2px rgba(0, 0, 0, 0.6);
      --shadow-lg: 0 12px 28px -4px rgba(0, 0, 0, 0.7);
      --shadow-xl: 0 20px 40px -6px rgba(0, 0, 0, 0.8);
    }

    [data-theme="orange"] {
      --bg-primary: #0b0c13;
      --bg-secondary: #141520;
      --bg-surface: #191b29;
      --bg-surface-elevated: #222538;
      --bg-subtle: rgba(255, 107, 0, 0.08);
      --bg-muted: rgba(255, 107, 0, 0.16);
      --text-primary: #ffffff;
      --text-secondary: #fed7aa;
      --text-muted: #fdba74;
      --brand-primary: #ff6b00;
      --brand-primary-hover: #ff8533;
      --brand-light: rgba(255, 107, 0, 0.18);
      --brand-border: rgba(255, 107, 0, 0.45);
      --brand-gradient: linear-gradient(135deg, #ff6b00 0%, #ff8800 45%, #f59e0b 100%);
      --status-healthy: #10b981;
      --status-healthy-bg: rgba(16, 185, 129, 0.18);
      --status-healthy-border: rgba(16, 185, 129, 0.45);
      --status-warning: #ff9800;
      --status-warning-bg: rgba(255, 152, 0, 0.18);
      --status-warning-border: rgba(255, 152, 0, 0.45);
      --status-critical: #ef4444;
      --status-critical-bg: rgba(239, 68, 68, 0.18);
      --status-critical-border: rgba(239, 68, 68, 0.45);
      --border-light: rgba(255, 107, 0, 0.25);
      --border-subtle: rgba(255, 107, 0, 0.12);
      --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.6);
      --shadow-md: 0 6px 16px -2px rgba(0, 0, 0, 0.7);
      --shadow-lg: 0 12px 28px -4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 107, 0, 0.15);
      --shadow-xl: 0 20px 40px -6px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 107, 0, 0.25);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.015em;
    }

    html {
      width: 100%;
      max-width: 100vw;
      min-height: 100%;
      overflow-x: hidden !important;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden !important;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      position: relative;
    }

    /* Freeze background scroll when modal or mobile sidebar is open */
    html.modal-open,
    body.modal-open {
      overflow: hidden !important;
      height: 100vh !important;
      touch-action: none !important;
      overscroll-behavior: none !important;
    }

    /* Buttons */
    .btn-primary {
      background: var(--brand-gradient);
      color: white;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 1.25rem;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 1.125rem;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-secondary:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-color: #cbd5e1;
    }

    /* Cards */
    .sla-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .sla-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .sla-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .sla-card-title {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }
    .sla-card-subtitle {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Status Pills */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-pill.healthy {
      background-color: var(--status-healthy-bg);
      color: #065f46;
      border: 1px solid var(--status-healthy-border);
    }
    .status-pill.warning {
      background-color: var(--status-warning-bg);
      color: #92400e;
      border: 1px solid var(--status-warning-border);
    }
    .status-pill.neutral {
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }
    .status-indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
    }
    .status-indicator-dot.pulse {
      animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    /* Grids */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
    }
    @media (max-width: 1200px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .grid-4 { grid-template-columns: 1fr; }
    }

    /* 5-Image Slideshow Landing & Login Styles */
    .landing-login-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: #070d18;
      color: #ffffff;
      font-family: var(--font-sans);
    }
    .bg-slideshow-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-slide-item {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 1.3s cubic-bezier(0.4, 0, 0.2, 1), transform 7s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .bg-slide-item.active {
      opacity: 1;
      transform: scale(1.05);
    }
    .bg-overlay-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(10, 18, 36, 0.55) 0%, rgba(7, 13, 26, 0.82) 65%, rgba(4, 8, 16, 0.96) 100%),
                  linear-gradient(to bottom, rgba(7, 13, 26, 0.65) 0%, rgba(7, 13, 26, 0.85) 60%, rgba(4, 8, 16, 0.98) 100%);
      pointer-events: none;
    }
    .bg-overlay-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.4;
      pointer-events: none;
    }
    .landing-navbar {
      position: relative;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2.5rem;
      max-width: 1700px;
      width: 100%;
      margin: 0 auto;
    }
    .landing-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }
    .landing-brand-name {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #ffffff;
    }
    .landing-nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.35rem 0.65rem;
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
      max-width: 100%;
    }
    .nav-link {
      background: none;
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-decoration: none;
      outline: none;
      flex-shrink: 0;
    }
    .nav-link:hover {
      color: #ff9800;
      background: rgba(255, 255, 255, 0.06);
    }
    .nav-link.active {
      color: #ff7800 !important;
      font-weight: 700;
      background: rgba(255, 107, 0, 0.14);
      border-color: rgba(255, 107, 0, 0.35);
      box-shadow: 0 0 14px rgba(255, 107, 0, 0.3);
    }
    .landing-nav-actions { 
      display: flex; 
      align-items: center; 
      gap: 0.875rem; 
      flex-shrink: 0;
    }
    .btn-nav-login {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.6rem 1.35rem;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s;
      white-space: nowrap;
    }
    .btn-nav-login:hover { background: rgba(255, 255, 255, 0.16); }
    .btn-nav-signup {
      background: linear-gradient(135deg, #ff6b00 0%, #ff8800 45%, #f59e0b 100%);
      color: #090a0f;
      font-size: 0.875rem;
      font-weight: 700;
      padding: 0.6rem 1.5rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255, 107, 0, 0.45);
      transition: all 0.25s;
      white-space: nowrap;
    }
    .btn-nav-signup:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(255, 107, 0, 0.6); }

    /* All Mobile Screen Adaptive Rules for Navbar */
    @media (max-width: 1024px) {
      .landing-navbar {
        padding: 1rem 1.25rem;
      }
    }
    @media (max-width: 880px) {
      .landing-navbar {
        flex-wrap: wrap;
        padding: 0.75rem 0.85rem;
        gap: 0.65rem;
        justify-content: space-between;
      }
      .landing-brand {
        order: 1;
      }
      .landing-nav-actions {
        order: 2;
        gap: 0.45rem;
      }
      .btn-nav-login {
        padding: 0.4rem 0.85rem;
        font-size: 0.78rem;
      }
      .btn-nav-signup {
        padding: 0.4rem 0.95rem;
        font-size: 0.78rem;
      }
      .landing-nav-links {
        order: 3;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 0.35rem 0.5rem;
        gap: 0.35rem;
        border-radius: 12px;
      }
      .landing-nav-links::-webkit-scrollbar {
        display: none;
      }
      .nav-link {
        font-size: 0.76rem;
        padding: 0.35rem 0.65rem;
      }
    }

    .landing-hero-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.5rem 1.5rem 3.5rem 1.5rem;
      max-width: 1180px;
      width: 100%;
      margin: auto auto;
    }

    /* Interactive Landing Telemetry Showcase */
    .landing-interactive-showcase {
      width: 100%;
      max-width: 1140px;
      margin: 1.75rem auto 1.5rem auto;
      text-align: left;
      animation: fadeInShowcase 0.25s ease-out;
    }
    @keyframes fadeInShowcase {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .telemetry-showcase-panel {
      background: rgba(13, 20, 36, 0.94);
      border: 1px solid rgba(255, 107, 0, 0.32);
      border-radius: 20px;
      padding: 1.6rem 1.85rem;
      backdrop-filter: blur(28px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75), 0 0 40px rgba(255, 107, 0, 0.14);
    }
    .telemetry-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 1.35rem;
    }
    .telemetry-live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      display: inline-block;
      animation: pulseGreen 1.8s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .btn-open-cockpit {
      background: linear-gradient(135deg, #ff6b00, #ff8800);
      color: #000000;
      font-size: 0.8125rem;
      font-weight: 700;
      padding: 0.45rem 1.15rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(255, 107, 0, 0.4);
      transition: all 0.2s;
    }
    .btn-open-cockpit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(255, 107, 0, 0.6);
    }
    .btn-action-sim {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-action-sim:hover {
      border-color: #ff6b00;
      background: rgba(255, 107, 0, 0.15);
    }
    .telemetry-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }
    .telemetry-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .telemetry-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    @media (max-width: 960px) {
      .telemetry-grid-4 { grid-template-columns: repeat(2, 1fr); }
      .telemetry-grid-3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .telemetry-grid-4 { grid-template-columns: 1fr; }
      .telemetry-grid-2 { grid-template-columns: 1fr; }
      .telemetry-showcase-panel {
        padding: 1.1rem 0.95rem;
        border-radius: 16px;
      }
      .telemetry-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .telemetry-header h3 {
        font-size: 1.15rem !important;
      }
    }
    .telemetry-mini-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 1.15rem 1.25rem;
      transition: all 0.2s ease;
    }
    .telemetry-mini-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 107, 0, 0.45);
      transform: translateY(-2px);
    }
    .mini-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .mini-card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }
    .mini-card-stat {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      font-family: var(--font-mono);
      margin-bottom: 0.5rem;
    }
    .mini-card-bar {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .mini-card-footer {
      font-size: 0.71875rem;
      color: rgba(255, 255, 255, 0.55);
    }
    .badge-healthy {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
    }
    .badge-warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #f59e0b;

            <div class="modal-backdrop" onclick="setState({ settingsModalOpen: false })">
              <div class="modal-box" onclick="event.stopPropagation()" style="padding: 2rem; max-width: 600px;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 1.25rem; margin-bottom: 1.5rem;">
                  <div>
                    <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary); margin: 0;">SLA Console Settings</h2>
                    <p style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.2rem;">Configure theme, notifications & telemetry sync preferences</p>
                  </div>
                  <button onclick="setState({ settingsModalOpen: false })" style="border: none; background: var(--bg-subtle); color: var(--text-primary); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem;">✕</button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                  <!-- Theme Selection -->
                  <div>
                    <label style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">
                      Dashboard Visual Theme
                    </label>
                    <div style="background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 12px; padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between;">
                      <div style="display: flex; align-items: center; gap: 0.65rem;">
                        <span style="font-size: 1.25rem;">🌙</span>
                        <div>
                          <div style="font-weight: 800; font-size: 0.9rem; color: #ffffff;">Dark Theme</div>
                          <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">High-Contrast Obsidian &amp; Cyber Orange (Active)</div>
                        </div>
                      </div>
                      <span style="font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.65rem; border-radius: 9999px; background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4);">Active</span>
                    </div>
                  </div>

                  <!-- Alert Notifications -->
                  <div style="background: var(--bg-subtle); border: 1px solid var(--border-light); border-radius: 12px; padding: 1rem;">
                    <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.75rem;">
                      Incident Notification Channels
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.65rem;">
                      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 0.84rem; color: var(--text-primary);">
                        <span>🔔 Audio alert on SLA Breach Warning (&lt; 30m MTTR)</span>
                        <input type="checkbox" checked style="accent-color: #ff6b00; width: 16px; height: 16px;" />
                      </label>
                      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 0.84rem; color: var(--text-primary);">
                        <span>📱 Urgent P1 PagerDuty SMS Escalation</span>
                        <input type="checkbox" checked style="accent-color: #ff6b00; width: 16px; height: 16px;" />
                      </label>
                      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 0.84rem; color: var(--text-primary);">
                        <span>💬 Auto-generate Slack Incident War Room</span>
                        <input type="checkbox" checked style="accent-color: #ff6b00; width: 16px; height: 16px;" />
                      </label>
                    </div>
                  </div>

                  <!-- Refresh Rate -->
                  <div>
                    <label style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">
                      Telemetry Polling Interval
                    </label>
                    <select style="width: 100%; padding: 0.6rem 0.85rem; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border-light); color: var(--text-primary); font-size: 0.84rem;">
                      <option value="5">Real-Time WebSocket (Sub-second stream)</option>
                      <option value="15" selected>Every 15 Seconds (Recommended)</option>
                      <option value="60">Every 1 Minute</option>
                    </select>
                  </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                  <button class="btn-secondary" onclick="setState({ settingsModalOpen: false })">Cancel</button>
                  <button class="btn-primary" onclick="showToast('Settings saved successfully!'); setState({ settingsModalOpen: false });">Save Preferences</button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderApp() {
      const appContainer = document.getElementById('app');
      if (!appState.currentUser) {
        appContainer.innerHTML = renderLogin();
      } else {
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
        document.documentElement.classList.remove('modal-open');
        document.body.classList.remove('modal-open');
        appContainer.innerHTML = renderDashboard();
      }
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const user = DEMO_USERS.find(u => u.role === appState.selectedRole) || DEMO_USERS[0];
      setState({ currentUser: user, loginModalOpen: false });
    }

    // Initial Render - Immediate, zero dependencies, zero blank screens!
    renderApp();
  </script>
</body>
</html>
